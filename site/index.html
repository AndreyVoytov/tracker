<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10191c">
    <meta name="description" content="Игровые проекты, оценки готовности геймплея и рабочие задачи команды.">
    <title>Studio Board — игровые проекты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=project-task-strips-20261013b">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="./projects.js?v=arcane-reskin-20261016"></script>
    <script defer src="./supabase-config.js"></script>
    <script defer src="./app.js?v=public-editing-20261015"></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="Studio Board">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-name">STUDIO<span>BOARD</span></span>
      </a>
      <div class="topbar-right">
        <div class="cloud-state" id="cloud-state" data-tone="muted">
          <span class="state-dot"></span>
          <span id="cloud-state-text">Проверяю базу</span>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="catalog-section">
        <div class="section-heading">
          <div>
            <h2>Проекты <span id="visible-count">15</span></h2>
          </div>
        </div>

        <div class="catalog-controls">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="Найти проект..." autocomplete="off">
            <kbd>/</kbd>
          </label>
          <label class="sort-control">
            <select id="sort-select" aria-label="Порядок проектов">
              <option value="readiness-desc">Готовность: сначала высокая</option>
              <option value="readiness-asc">Готовность: сначала низкая</option>
              <option value="name-asc">Название: А → Я</option>
              <option value="tasks-desc">Больше открытых задач</option>
            </select>
          </label>
        </div>

        <div class="project-grid" id="project-grid" aria-live="polite"></div>
        <div class="empty-state" id="empty-state" hidden>
          <span>⌕</span>
          <strong>Ничего не нашлось</strong>
          <p>Попробуйте изменить запрос.</p>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <span>STUDIO BOARD <span class="footer-dot">·</span> 2026</span>
      <span>Готовность — ориентир по текущей сборке и материалам проекта.</span>
    </footer>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="detail-title">
      <div class="dialog-topline">
        <span class="dialog-kicker">КАРТОЧКА ПРОЕКТА</span>
        <button class="icon-button close-dialog" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="project-detail"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
